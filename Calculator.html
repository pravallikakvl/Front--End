<!DOCTYPE html>
<html>
<head>
  <link rel = "stylesheet" href="cal.css"> 
</head>
<body>
  <div class="container">
    <div class="innercontainer">
      <div class="CalName"> 
        <ul>
          <li>CT210</li>
          <li><hr></li>
        <li>AUTO POWER OFF</li>
         <!-- <hr> -->
        </ul>
      </div>
      <div class="display" id="display">0</div>
      <div class="keypad">
        <table id="keypadDisplay">
          <tr>
          <td><button type="button" class="button" onclick="press('7')">7</button></td>
          <td><button type="button" class="button" onclick="press('8')">8</button></td>
          <td><button type="button" class="button"onclick="press('9')">9</button></td>
          <td><button type="button" class="button"onclick="press('+')">+</button></td>
          </tr>
          <tr>
            <td><button type="button" class="button" onclick="press('4')">4</button></td>
           <td><button type="button" class="button"onclick="press('5')">5</button></td>
           <td><button type="button" class="button"onclick="press('6')">6</button></td>
           <td><button type="button" class="button"onclick="press('-')">-</button></td>
          </tr>
          <tr>
             <td><button type="button" class="button"onclick="press('1')">1</button></td>
           <td><button type="button" class="button"onclick="press('2')">2</button></td>
           <td><button type="button" class="button"onclick="press('3')">3</button></td>
           <td><button type="button" class="button"onclick="press('*')">*</button></td>
          </tr>
          <tr>
            <td><button type="button" class="button"onclick="press('.')">.</button></td>
           <td><button type="button" class="button"onclick="press('0')">0</button></td>
           <td><button type="button" class="button"onclick="press('/')">/</button></td>
           <td><button type="button" class="button"onclick="calculate()"onclick="press('=')">=</button></td>
          </tr>
          <tr>
            <td><button type="button" class="button" onclick="clearDisplay()">Clear</button></td>           
          </tr>
        </table>
        <br>
      </div>
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
